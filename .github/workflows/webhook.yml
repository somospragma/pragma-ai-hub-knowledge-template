      - name: Notificar al Hub PROD
        if: steps.changed.outputs.files != '[]'
        env:
          SOPP_HUB_URL: ${{ secrets.SOPP_HUB_URL }}
          SOPP_HUB_API_KEY: ${{ secrets.SOPP_HUB_API_KEY }}
          SOPP_WEBHOOK_SECRET: ${{ secrets.SOPP_WEBHOOK_SECRET }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          REPO_FULL_NAME: ${{ github.repository }}
          GIT_REF: ${{ github.ref }}
          PUSHER: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          REPO_NAME="${REPO_FULL_NAME#*/}"
          PAYLOAD="{\"ref\":\"${GIT_REF}\",\"repository\":{\"full_name\":\"${REPO_FULL_NAME}\",\"clone_url\":\"https://github.com/${REPO_FULL_NAME}.git\"},\"changed_files\":${CHANGED_FILES},\"pusher\":\"${PUSHER}\",\"commit_sha\":\"${COMMIT_SHA}\"}"
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$SOPP_WEBHOOK_SECRET" | sed 's/^.* //')

