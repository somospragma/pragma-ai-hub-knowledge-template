          fetch-depth: 2

      - name: Obtener archivos modificados
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(md|json|mdc)$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
