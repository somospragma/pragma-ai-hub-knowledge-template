name: Notificar Hub

on:
  push:
    branches: [main]
    paths:
      - 'chapters/**/*.md'
      - 'shared/**/*.md'

jobs:
  notify-hub:
    name: Notificar cambios al Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Obtener archivos modificados
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(md|json)$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Notificar al Hub
        if: steps.changed.outputs.files != '[]'
        env:
          SOPP_HUB_URL: ${{ secrets.SOPP_HUB_URL }}
          SOPP_HUB_API_KEY: ${{ secrets.SOPP_HUB_API_KEY }}
          SOPP_WEBHOOK_SECRET: ${{ secrets.SOPP_WEBHOOK_SECRET }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          REPO_FULL_NAME: ${{ github.repository }}
          REPO_CLONE_URL: https://github.com/${{ github.repository }}.git
          GIT_REF: ${{ github.ref }}
          PUSHER: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          PAYLOAD="{\"ref\":\"${GIT_REF}\",\"repository\":{\"full_name\":\"${REPO_FULL_NAME}\",\"clone_url\":\"${REPO_CLONE_URL}\"},\"changed_files\":${CHANGED_FILES},\"pusher\":\"${PUSHER}\",\"commit_sha\":\"${COMMIT_SHA}\"}"

          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$SOPP_WEBHOOK_SECRET" | sed 's/^.* //')

          HTTP_CODE=$(curl -s -o /tmp/webhook_response.txt -w "%{http_code}" \
            -X POST "${SOPP_HUB_URL}/webhook/github" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${SOPP_HUB_API_KEY}" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: ${RUN_ID}" \
            -H "X-Repo-Name: ${REPO_FULL_NAME#*/}" \
            -d "$PAYLOAD")

          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/webhook_response.txt
          echo ""

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Webhook falló con status $HTTP_CODE"
            exit 1
          fi

          echo "✓ Webhook enviado exitosamente"
