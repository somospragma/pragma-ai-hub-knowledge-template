name: Notificar Hub

on:
  push:
    branches: [main]
    paths:
      - 'chapters/**/*.md'
      - 'shared/**/*.md'

jobs:
  notify-hub:
    name: Notificar cambios al Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Obtener archivos modificados
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(md|json)$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Notificar al Hub
        if: steps.changed.outputs.files != '[]'
        env:
          SOPP_HUB_URL: ${{ secrets.SOPP_HUB_URL }}
          SOPP_HUB_API_KEY: ${{ secrets.SOPP_HUB_API_KEY }}
          SOPP_WEBHOOK_SECRET: ${{ secrets.SOPP_WEBHOOK_SECRET }}
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "ref": "${{ github.ref }}",
            "repository": {
              "full_name": "${{ github.repository }}",
              "clone_url": "https://github.com/${{ github.repository }}.git"
            },
            "changed_files": ${{ steps.changed.outputs.files }},
            "pusher": "${{ github.actor }}",
            "commit_sha": "${{ github.sha }}"
          }
          EOF
          )

          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$SOPP_WEBHOOK_SECRET" | cut -d' ' -f2)

          curl -s -X POST "${SOPP_HUB_URL}/webhook/github" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${SOPP_HUB_API_KEY}" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: ${{ github.run_id }}" \
            -H "X-Repo-Name: ${{ github.repository }}" \
            -d "$PAYLOAD"
