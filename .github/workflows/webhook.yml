        env:
          SOPP_HUB_URL: ${{ secrets.SOPP_HUB_URL }}
          SOPP_HUB_API_KEY: ${{ secrets.SOPP_HUB_API_KEY }}
          SOPP_WEBHOOK_SECRET: ${{ secrets.SOPP_WEBHOOK_SECRET }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          REPO_FULL_NAME: ${{ github.repository }}
          GIT_REF: ${{ github.ref }}
          PUSHER: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          REPO_NAME="${REPO_FULL_NAME#*/}"
          PAYLOAD="{\"ref\":\"${GIT_REF}\",\"repository\":{\"full_name\":\"${REPO_FULL_NAME}\",\"clone_url\":\"https://github.com/${REPO_FULL_NAME}.git\"},\"changed_files\":${CHANGED_FILES},\"pusher\":\"${PUSHER}\",\"commit_sha\":\"${COMMIT_SHA}\"}"
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$SOPP_WEBHOOK_SECRET" | sed 's/^.* //')

          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "${SOPP_HUB_URL}/webhook/github" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${SOPP_HUB_API_KEY}" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: ${RUN_ID}" \
            -H "X-Repo-Name: ${REPO_NAME}" \
            -d "$PAYLOAD")

          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.txt && echo ""
          [ "$HTTP_CODE" -lt 400 ] && echo "✓ Hub DEV notificado" || { echo "❌ Falló"; exit 1; }

  # ─────────────────────────────────────────────
  # Ambiente oficial PROD (solo main)
  # ─────────────────────────────────────────────
